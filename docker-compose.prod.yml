# Production overrides for docker-compose
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  influxdb:
    # Don't expose InfluxDB port externally in production
    ports: []
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  core:
    ports:
      - "50051:50051" # gRPC for agents (internal network only recommended)
      # HTTP API accessed via nginx reverse proxy
    environment:
      - GIN_MODE=release # Reduced logging
      # CORS_ALLOWED_ORIGINS should be set in .env.production
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  web:
    ports:
      - "80:80"
      - "443:443" # If using SSL
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
